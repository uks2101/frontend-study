<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>movie search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="search-wrap">
      <h1>검색</h1>
      <form>
        <div class="search-box">
          <img src="image/search.svg" alt="search">
          <input type="text" placeholder="작품을 검색해보세요.">
        </div>
        <button>검색</button>
      </form>
    </section>
    <section class="movie-wrap">
      <h1>인기 영화 목록</h1>
      <ul class="movie-list">
        <li class="movie-card">
          <img src="image/movie-poster-01.jpeg" alt="파묘">
          <div>
            <p>파묘</p>
            <span>2024</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-02.jpeg" alt="범죄도시3">
          <div>
            <p>범죄도시3</p>
            <span>2023</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-03.jpeg" alt="검은 사제들">
          <div>
            <p>검은 사제들</p>
            <span>2015</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-04.jpeg" alt="남산의 부장들">
          <div>
            <p>남산의 부장들</p>
            <span>2020</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-05.jpeg" alt="백두산">
          <div>
            <p>백두산</p>
            <span>2019</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-06.jpeg" alt="범죄와의 전쟁">
          <div>
            <p>범죄와의 전쟁</p>
            <span>2012</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-07.jpeg" alt="1987">
          <div>
            <p>1987</p>
            <span>2017</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-08.jpeg" alt="비상선언">
          <div>
            <p>비상선언</p>
            <span>2022</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-09.jpeg" alt="부산행">
          <div>
            <p>부산행</p>
            <span>2016</span>
          </div>
        </li>
        <li class="movie-card">
          <img src="image/movie-poster-10.jpeg" alt="독전">
          <div>
            <p>독전</p>
            <span>2018</span>
          </div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
