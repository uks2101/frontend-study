<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>movie search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="search-wrap">
      <div>
        <h1>검색</h1>
        <button type="button" id="favorite-toggle">즐겨찾기</button>
      </div>
      <form id="search-form">
        <div class="search-box">
          <img src="image/search.svg" alt="search">
          <input type="text" id="search-input" placeholder="작품을 검색해보세요.">
        </div>
        <button type="submit">검색</button>
      </form>
    </section>
    <section class="movie-wrap">
      <h1>인기 영화 목록</h1>
      <ul class="movie-list"></ul>
    </section>
  </main>

  <div class="modal" id="movie-modal" hidden>
    <div class="modal-dim" data-close></div>
    <div class="modal-content">
      <button type="button" class="modal-close" data-close>&times;</button>
      <img class="modal-poster" src="" alt="">
      <div class="modal-info">
        <h2 class="modal-title"></h2>
        <button type="button" class="modal-favorite" data-favorite-modal>☆</button>
        <p class="modal-meta"></p>
        <p class="modal-overview"></p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
